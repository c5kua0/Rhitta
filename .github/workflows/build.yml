name: Build Rhitta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1'

      - name: Build
        run: gradle build

      - name: Upload Rhitta JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rhitta
          path: build/libs/*.jar
